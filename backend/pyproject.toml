[tool.poetry]
name = "backlight-tracker"
version = "0.1.0"
description = "FastAPI and OpenCV backend for a dynamic TV backlight controller"
authors = ["Aurora contributors"]
packages = [{ include = "backlight_tracker" }]

[tool.poetry.dependencies]
python = "^3.10"
numpy = ">=1.26,<3.0"
opencv-python-headless = "^4.10"
fastapi = "^0.115"
uvicorn = {extras = ["standard"], version = "^0.30"}

[tool.poetry.group.dev.dependencies]
pytest = "^8.2"
ruff = "^0.5"
httpx = "^0.28"

[tool.poetry.scripts]
backlight-tracker = "backlight_tracker.cli:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# Black/Ruff formatting intentionally leaves some long calls unwrapped.
ignore = ["E501"]
